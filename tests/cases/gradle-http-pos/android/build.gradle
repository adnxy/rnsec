buildscript {
    repositories {
        google()
        maven { url "http://repo.example-mirror.com/maven2" }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            url = uri('http://nexus.example-corp.net/repository/releases/')
            allowInsecureProtocol = true
        }
        maven {
            url mavenUrlFromProperty
            allowInsecureProtocol = true
        }
    }
}
