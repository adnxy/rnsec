name: 🔒 Security Scan

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

# upload-sarif needs security-events: write, the PR comment needs pull-requests: write.
# On pull requests from forks GitHub gives the token read-only access: the SARIF upload and the comment
# fail there, so skip those steps for forks or run this workflow from a trusted trigger.
permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch full history for git diff
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install rnsec
      # --owasp, --format and the critical severity need rnsec 1.5.0 or newer
      run: npm install -g rnsec
    
    - name: Scan changed files (source for the PR comment)
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      # --fail-on none: this scan only feeds the comment, the full scan below is the gate.
      # origin/<branch>: pull request checkouts have no local branch for the base.
      run: rnsec scan --changed-files "origin/$BASE_REF" --md security-report.md --output rnsec-report.json --fail-on none --silent
    
    - name: Comment PR with security results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          try {
            const markdownReport = fs.readFileSync('security-report.md', 'utf8');
            const commentIdentifier = '<!-- rnsec-security-report -->';
            
            // Find existing rnsec comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body?.includes(commentIdentifier)
            );
            
            // Extract previous scan results for comparison
            let previousFindings = [];
            if (existingComment) {
              // Parse JSON data from previous comment if available
              const jsonMatch = existingComment.body.match(/<!-- scan-data: (.*?) -->/);
              if (jsonMatch) {
                try {
                  previousFindings = JSON.parse(Buffer.from(jsonMatch[1], 'base64').toString());
                } catch (e) {
                  console.log('Could not parse previous scan data');
                }
              }
            }
            
            // Add current scan data as hidden JSON for next comparison
            let currentFindings = [];
            try {
              const jsonReport = JSON.parse(fs.readFileSync('rnsec-report.json', 'utf8'));
              currentFindings = jsonReport.findings || [];
            } catch (e) {
              console.log('Could not read JSON report for comparison');
            }
            
            // Embed scan data in comment for future comparisons
            const scanDataComment = currentFindings.length > 0 
              ? `\n<!-- scan-data: ${Buffer.from(JSON.stringify(currentFindings)).toString('base64')} -->`
              : '';
            
            const finalReport = markdownReport + scanDataComment;
            
            if (existingComment) {
              // Update existing comment with comparison
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: finalReport
              });
              console.log('Updated existing security report comment with comparison data');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: finalReport
              });
              console.log('Created new security report comment');
            }
          } catch (error) {
            console.log('Error posting security report:', error.message);
          }
    
    - name: Full security scan (fails the job on findings)
      # Exit codes: 0 clean, 1 a finding at or above --fail-on, 2 rnsec error (bad option, unreadable config).
      # --sarif writes the SARIF file even when the scan exits 1. --owasp adds the MASVS coverage section
      # to full-security-report.json; the SARIF always carries the MASVS taxonomy, tags and help links.
      # Always scan the whole project for SARIF: a --changed-files report would close Code Scanning alerts
      # of every file it did not scan.
      run: rnsec scan --owasp --sarif rnsec.sarif --md full-security-report.md --html full-security-report.html --output full-security-report.json --fail-on high --silent
    
    - name: Upload SARIF to GitHub Code Scanning
      # Runs after a failed scan too; skipped when the scan crashed (exit 2) and wrote no SARIF.
      if: always() && hashFiles('rnsec.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: rnsec.sarif
        category: rnsec
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          security-report.md
          full-security-report.md
          full-security-report.html
          full-security-report.json
          rnsec.sarif
        if-no-files-found: ignore
        retention-days: 30
